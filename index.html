<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Programación</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Fonts Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <figure>
            <img src="img/logo.png" alt="Imagen del logo Verduletito">
        </figure>

        <ul>
            <li>
                <img src="img/icon/TdesignCartFilled.svg" alt="Icono de carrito">
                <span>Carrito</span>
            </li>
            <li>
                <img src="img/icon/TdesignInfoCircleFilled.svg" alt="Icono de información">
                <span>Info</span>
            </li>
        </ul>
    </header>

    <main>
        <section id="filtro">
            <h2>Filtrar Productos</h2>
            <div id="filtros-categorias"></div>
        </section>

        <section id="productos">
            <h2>Productos</h2>
            <div id="lista-productos"></div>
        </section>
    </main>

    <footer>Footer</footer>

    <script src="js/main.js"></script>
</body>

</html>
